name: UI Shift QA

on:
  push:
    branches:
      - ui/aoxa-shadcn-visual-shift
  workflow_dispatch:

jobs:
  parity:
    name: Functional source parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify UI shift did not edit unapproved behavior files
        shell: bash
        run: |
          BASE=65c2a1c6d3f8260357582d03ac5ca19d20bf7cf7
          changed="$(git diff --name-only "$BASE"..HEAD -- '*.js' '*.jsx' \
            | grep -v '^src/components/ui/' \
            | grep -v '^src/pages/__tests__/TargetedCorrectness.test.jsx$' \
            | grep -v '^src/components/layout/Navbar.jsx
            || true)"
          if [ -n "$changed" ]; then
            echo "Unexpected functional JavaScript/JSX changes:"
            echo "$changed"
            exit 1
          fi
          echo "No unapproved application behavior JS/JSX files changed from the locked UI baseline."
          echo "Approved visual/UX exceptions: Navbar.jsx, Footer.jsx, WorkspaceSidebar.jsx, ProfileCompletionChecklist.jsx, ClientDashboard.jsx, ClientSettings.jsx"
          echo "Approved QA hardening: backend/controllers/contactSharingController.js"

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start canonical MySQL test service
        run: |
          sudo systemctl start mysql
          if mysql -uroot -e "SELECT 1" >/dev/null 2>&1; then
            MYSQL_ADMIN=(mysql -uroot)
          else
            MYSQL_ADMIN=(mysql -uroot -proot)
          fi
          "${MYSQL_ADMIN[@]}" -e "CREATE USER IF NOT EXISTS 'serbisyo_ci'@'localhost' IDENTIFIED BY 'serbisyo_ci'; GRANT ALL PRIVILEGES ON *.* TO 'serbisyo_ci'@'localhost' WITH GRANT OPTION; FLUSH PRIVILEGES;"
      - name: Run complete backend suite
        env:
          CANONICAL_TEST_DB_SOCKET: /var/run/mysqld/mysqld.sock
          CANONICAL_TEST_DB_USER: serbisyo_ci
          CANONICAL_TEST_DB_PASSWORD: serbisyo_ci
        run: npm test
 \
            | grep -v '^src/components/layout/Footer.jsx
            || true)"
          if [ -n "$changed" ]; then
            echo "Unexpected functional JavaScript/JSX changes:"
            echo "$changed"
            exit 1
          fi
          echo "No unapproved application behavior JS/JSX files changed from the locked UI baseline."
          echo "Approved visual-structure exceptions: Navbar.jsx and Footer.jsx"
          echo "Approved QA hardening: backend/controllers/contactSharingController.js"

