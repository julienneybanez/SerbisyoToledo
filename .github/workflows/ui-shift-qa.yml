name: UI Shift QA

on:
  push:
    branches:
      - ui/aoxa-shadcn-visual-shift
  workflow_dispatch:

jobs:
  parity:
    name: Functional source parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify UI shift did not edit unapproved behavior files
        shell: bash
        run: |
          BASE=65c2a1c6d3f8260357582d03ac5ca19d20bf7cf7
          changed="$(git diff --name-only "$BASE"..HEAD -- '*.js' '*.jsx'             | grep -v '^src/components/ui/'             | grep -v '^src/pages/__tests__/TargetedCorrectness.test.jsx$'             | grep -v '^src/components/layout/Navbar.jsx$'             | grep -v '^src/components/layout/Footer.jsx$'             | grep -v '^src/components/layout/WorkspaceSidebar.jsx$'             | grep -v '^src/components/mobile/MobileTopBar.jsx$'             | grep -v '^src/components/common/ProfileCompletionChecklist.jsx$'             | grep -v '^src/pages/Home.jsx$'             | grep -v '^src/pages/About.jsx$'             | grep -v '^src/pages/Feed.jsx$'             | grep -v '^src/pages/ClientDashboard.jsx$'             | grep -v '^src/pages/ServiceProviderDashboard.jsx$'             | grep -v '^src/pages/ClientSettings.jsx$'             | grep -v '^src/pages/admin/AdminDashboard.jsx$'             | grep -v '^backend/controllers/contactSharingController.js$'             || true)"
          if [ -n "$changed" ]; then
            echo "Unexpected functional JavaScript/JSX changes:"
            echo "$changed"
            exit 1
          fi
          echo "No unapproved application behavior JS/JSX files changed from the locked UI baseline."

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start canonical MySQL test service
        run: |
          sudo systemctl start mysql
          if mysql -uroot -e "SELECT 1" >/dev/null 2>&1; then
            MYSQL_ADMIN=(mysql -uroot)
          else
            MYSQL_ADMIN=(mysql -uroot -proot)
          fi
          "${MYSQL_ADMIN[@]}" -e "CREATE USER IF NOT EXISTS 'serbisyo_ci'@'localhost' IDENTIFIED BY 'serbisyo_ci'; GRANT ALL PRIVILEGES ON *.* TO 'serbisyo_ci'@'localhost' WITH GRANT OPTION; FLUSH PRIVILEGES;"
      - name: Run complete backend suite
        env:
          CANONICAL_TEST_DB_SOCKET: /var/run/mysqld/mysqld.sock
          CANONICAL_TEST_DB_USER: serbisyo_ci
          CANONICAL_TEST_DB_PASSWORD: serbisyo_ci
        run: npm test

  browser:
    name: Responsive phone-app browser QA
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium QA tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/serbisyo-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/serbisyo-preview.log
          exit 1
      - name: Run phone-app browser matrix
        run: npx playwright test qa/ui-browser.pw.cjs --browser=chromium --workers=1 --reporter=line
      - name: Upload phone-app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-phone-app-qa
          path: artifacts/ui-phone
          if-no-files-found: warn

