name: UI Shift QA

on:
  push:
    branches:
      - ui/aoxa-shadcn-visual-shift
  workflow_dispatch:

jobs:
  parity:
    name: Functional source parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify UI shift did not edit unapproved behavior files
        shell: bash
        run: |
          BASE=65c2a1c6d3f8260357582d03ac5ca19d20bf7cf7
          changed="$(git diff --name-only "$BASE"..HEAD -- '*.js' '*.jsx' \
            | grep -v '^src/components/ui/' \
            | grep -v '^src/pages/__tests__/TargetedCorrectness.test.jsx$' \
            | grep -v '^backend/controllers/contactSharingController.js$' \
            || true)"
          if [ -n "$changed" ]; then
            echo "Unexpected functional JavaScript/JSX changes:"
            echo "$changed"
            exit 1
          fi
          echo "No unapproved application behavior JS/JSX files changed from the locked UI baseline."
          echo "Approved QA hardening: backend/controllers/contactSharingController.js"

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start canonical MySQL test service
        run: |
          sudo systemctl start mysql
          if mysql -uroot -e "SELECT 1" >/dev/null 2>&1; then
            MYSQL_ADMIN=(mysql -uroot)
          else
            MYSQL_ADMIN=(mysql -uroot -proot)
          fi
          "${MYSQL_ADMIN[@]}" -e "CREATE USER IF NOT EXISTS 'serbisyo_ci'@'localhost' IDENTIFIED BY 'serbisyo_ci'; GRANT ALL PRIVILEGES ON *.* TO 'serbisyo_ci'@'localhost' WITH GRANT OPTION; FLUSH PRIVILEGES;"
      - name: Run complete backend suite
        env:
          CANONICAL_TEST_DB_SOCKET: /var/run/mysqld/mysqld.sock
          CANONICAL_TEST_DB_USER: serbisyo_ci
          CANONICAL_TEST_DB_PASSWORD: serbisyo_ci
        run: npm test


  browser:
    name: Browser responsive/theme/localization smoke
    needs: frontend
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'browser QA')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser QA tooling without changing lockfile
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/serbisyo-vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/serbisyo-vite-preview.log
          exit 1
      - name: Create browser QA matrix
        shell: bash
        run: |
          mkdir -p qa-tmp artifacts/ui-browser
          cat > qa-tmp/ui-browser.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');

          const BASE = 'http://127.0.0.1:4173';

          const USERS = {
            client: {
              id: 101,
              userType: 'client',
              fullName: 'QA Client',
              email: 'client@example.com',
              isVerified: true,
              emailVerified: true,
            },
            provider: {
              id: 202,
              userType: 'tradesperson',
              fullName: 'QA Provider',
              email: 'provider@example.com',
              isVerified: true,
              emailVerified: true,
            },
            admin: {
              id: 303,
              userType: 'admin',
              fullName: 'QA Admin',
              email: 'admin@example.com',
              isVerified: true,
              emailVerified: true,
            },
          };

          const PROVIDER_PROFILE = {
            id: 11,
            userId: 202,
            fullName: 'QA Provider',
            name: 'QA Provider',
            profession: 'Plumber',
            barangayAddress: 'Poblacion, Toledo City',
            location: 'Poblacion, Toledo City',
            startingPrice: 500,
            dailyRate: 500,
            pricingUnit: 'per_day',
            isPublished: true,
            isVerified: true,
            verificationStatus: 'approved',
            acceptingBookings: true,
            aboutMe: 'Local service provider.',
            categories: ['Plumbing'],
            serviceTypes: ['Leak Repair'],
            skills: ['Pipe Repair'],
            languages: ['Cebuano', 'English'],
            portfolio: [],
            reviews: [],
            rating: 0,
            reviewCount: 0,
          };

          function json(route, body, status = 200) {
            return route.fulfill({
              status,
              contentType: 'application/json',
              body: JSON.stringify(body),
            });
          }

          async function installApiMocks(page, user) {
            await page.route('**/api/**', async (route) => {
              const request = route.request();
              const url = new URL(request.url());
              const path = url.pathname;

              if (path.endsWith('/auth/csrf')) {
                return json(route, { success: true, data: { csrfToken: 'qa-csrf-token' } });
              }

              if (path.endsWith('/auth/me')) {
                if (!user) {
                  return json(route, { success: false, message: 'Not authenticated' }, 401);
                }
                return json(route, { success: true, data: { user } });
              }

              if (path.endsWith('/messages/unread-count') || path.endsWith('/notifications/unread-count')) {
                return json(route, { success: true, data: { count: 0 } });
              }

              if (path.endsWith('/messages')) {
                return json(route, { success: true, data: { conversations: [] } });
              }

              if (path.endsWith('/notifications')) {
                return json(route, { success: true, data: { notifications: [], total: 0 } });
              }

              if (path.endsWith('/service-requests/client') || path.endsWith('/service-requests/provider')) {
                return json(route, { success: true, data: { requests: [] } });
              }

              if (path.endsWith('/service-profiles/taxonomy')) {
                return json(route, { success: true, data: { categories: [] } });
              }

              if (path.endsWith('/service-profiles/all')) {
                return json(route, { success: true, data: [] });
              }

              if (path.endsWith('/service-profiles/user/me')) {
                return json(route, { success: true, data: PROVIDER_PROFILE });
              }

              if (path.endsWith('/service-profiles/availability/me')) {
                return json(route, {
                  success: true,
                  data: {
                    acceptingBookings: true,
                    availableSlots: [],
                    availability: [],
                    settings: { availability_status: 'available' },
                  },
                });
              }

              if (path.endsWith('/service-profiles/portfolio/me')) {
                return json(route, { success: true, data: { portfolio: [] } });
              }

              if (path.endsWith('/service-profiles/credentials/me')) {
                return json(route, { success: true, data: { credentials: [] } });
              }

              if (/\/service-profiles\/11$/.test(path)) {
                return json(route, { success: true, data: PROVIDER_PROFILE });
              }

              if (path.endsWith('/user/profile')) {
                return json(route, {
                  success: true,
                  data: {
                    id: user?.id || 0,
                    fullName: user?.fullName || 'QA User',
                    email: user?.email || 'qa@example.com',
                    phone: '09171234567',
                    address: 'Poblacion, Toledo City',
                    profilePhoto: null,
                  },
                });
              }

              if (path.endsWith('/user/onboarding-progress')) {
                return json(route, {
                  success: true,
                  data: {
                    percentage: 100,
                    completed: 4,
                    total: 4,
                    steps: [],
                  },
                });
              }

              if (path.endsWith('/user/verification-status')) {
                return json(route, {
                  success: true,
                  data: { status: 'approved', isVerified: true },
                });
              }

              if (path.endsWith('/admin/dashboard-stats')) {
                return json(route, {
                  success: true,
                  data: {
                    pendingVerifications: 0,
                    activeReports: 0,
                    verifiedProviders: 0,
                    totalUsers: 0,
                  },
                });
              }

              if (
                path.endsWith('/admin/users') ||
                path.endsWith('/admin/verification-requests') ||
                path.endsWith('/admin/provider-credentials') ||
                path.endsWith('/admin/reports')
              ) {
                return json(route, { success: true, data: [] });
              }

              if (path.endsWith('/health')) {
                return json(route, {
                  success: true,
                  status: 'healthy',
                  database: 'connected',
                  timestamp: new Date().toISOString(),
                });
              }

              return json(route, { success: true, data: {} });
            });
          }

          async function createPage(browser, { role = 'guest', width = 390, height = 844, theme = 'light', language = 'en' } = {}) {
            const user = role === 'guest' ? null : USERS[role];
            const context = await browser.newContext({ viewport: { width, height } });

            await context.addInitScript((state) => {
              localStorage.setItem('serbisyo-toledo-theme', state.theme);
              localStorage.setItem('serbisyo-toledo-language', state.language);
              if (state.user) {
                localStorage.setItem('user', JSON.stringify(state.user));
              } else {
                localStorage.removeItem('user');
              }
            }, { user, theme, language });

            const page = await context.newPage();
            await installApiMocks(page, user);
            return { context, page };
          }

          async function openAndAudit(page, path) {
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message || String(error)));

            await page.goto(BASE + path, { waitUntil: 'domcontentloaded', timeout: 15000 });
            await page.waitForTimeout(600);

            // Trigger scroll-reveal/intersection animations before measuring or capturing.
            const documentHeight = await page.evaluate(() => document.documentElement.scrollHeight);
            const step = Math.max(280, Math.floor((page.viewportSize()?.height || 800) * 0.72));
            for (let y = 0; y < documentHeight; y += step) {
              await page.evaluate((scrollY) => window.scrollTo(0, scrollY), y);
              await page.waitForTimeout(70);
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(180);

            const metrics = await page.evaluate(() => {
              const root = document.documentElement;
              const body = document.body;
              const viewportWidth = window.innerWidth;
              const fixedOverflow = [...document.querySelectorAll('button, a, [role="button"], nav, header, footer')]
                .filter((element) => {
                  const style = getComputedStyle(element);
                  if (style.display === 'none' || style.visibility === 'hidden') return false;
                  if (!['fixed', 'sticky'].includes(style.position)) return false;
                  const rect = element.getBoundingClientRect();
                  return rect.width > 0 && (rect.left < -2 || rect.right > viewportWidth + 2);
                })
                .slice(0, 10)
                .map((element) => ({
                  tag: element.tagName,
                  className: element.className,
                  text: (element.textContent || '').trim().slice(0, 80),
                  rect: element.getBoundingClientRect().toJSON(),
                }));

              return {
                scrollWidth: Math.max(root.scrollWidth, body?.scrollWidth || 0),
                viewportWidth,
                bodyTextLength: (body?.innerText || '').trim().length,
                fixedOverflow,
              };
            });

            expect(metrics.bodyTextLength).toBeGreaterThan(10);
            expect(metrics.scrollWidth).toBeLessThanOrEqual(metrics.viewportWidth + 2);
            expect(metrics.fixedOverflow).toEqual([]);
            expect(pageErrors).toEqual([]);
          }

          const routeMatrix = {
            guest: ['/', '/about', '/feed', '/login', '/register', '/forgot-password'],
            client: ['/client-dashboard', '/feed', '/requests', '/messages', '/notifications', '/client-settings'],
            provider: ['/dashboard', '/requests', '/messages', '/provider-schedule', '/provider-availability', '/provider-credentials', '/provider-settings'],
            admin: ['/admin/dashboard', '/admin/users', '/admin/verifications', '/admin/credentials', '/admin/reports', '/admin/settings'],
          };

          test('all core routes render without page-level horizontal overflow at 390px', async ({ browser }) => {
            test.setTimeout(120000);
            for (const [role, paths] of Object.entries(routeMatrix)) {
              for (const path of paths) {
                const { context, page } = await createPage(browser, { role, width: 390, height: 844, theme: 'light', language: 'en' });
                await openAndAudit(page, path);
                await context.close();
              }
            }
          });

          test('representative role surfaces fit the 320/360/390/430 mobile matrix', async ({ browser }) => {
            test.setTimeout(120000);
            const representatives = [
              ['guest', '/'],
              ['client', '/client-dashboard'],
              ['provider', '/dashboard'],
              ['admin', '/admin/users'],
            ];
            for (const width of [320, 360, 390, 430]) {
              for (const [role, path] of representatives) {
                const { context, page } = await createPage(browser, { role, width, height: 844, theme: 'light', language: 'en' });
                await openAndAudit(page, path);
                await page.screenshot({
                  path: 'artifacts/ui-browser/' + role + '-' + width + '-light-en.png',
                  fullPage: true,
                });
                await context.close();
              }
            }
          });

          test('representative role surfaces fit dark mode on mobile and desktop', async ({ browser }) => {
            test.setTimeout(120000);
            const representatives = [
              ['guest', '/'],
              ['client', '/client-dashboard'],
              ['provider', '/dashboard'],
              ['admin', '/admin/dashboard'],
            ];
            for (const width of [390, 1366]) {
              for (const [role, path] of representatives) {
                const { context, page } = await createPage(browser, { role, width, height: width === 390 ? 844 : 900, theme: 'dark', language: 'en' });
                await openAndAudit(page, path);
                await page.screenshot({
                  path: 'artifacts/ui-browser/' + role + '-' + width + '-dark-en.png',
                  fullPage: true,
                });
                await context.close();
              }
            }
          });

          test('representative Cebuano surfaces fit mobile and desktop layouts', async ({ browser }) => {
            test.setTimeout(120000);
            const representatives = [
              ['guest', '/'],
              ['client', '/client-dashboard'],
              ['provider', '/provider-availability'],
              ['admin', '/admin/reports'],
            ];
            for (const width of [390, 1366]) {
              for (const [role, path] of representatives) {
                const { context, page } = await createPage(browser, { role, width, height: width === 390 ? 844 : 900, theme: 'light', language: 'ceb' });
                await openAndAudit(page, path);
                await page.screenshot({
                  path: 'artifacts/ui-browser/' + role + '-' + width + '-light-ceb.png',
                  fullPage: true,
                });
                await context.close();
              }
            }
          });

          test('public home keeps real image assets renderable', async ({ browser }) => {
            const { context, page } = await createPage(browser, { role: 'guest', width: 1366, height: 900, theme: 'light', language: 'en' });
            await openAndAudit(page, '/');
            const imageState = await page.evaluate(() => [...document.images].map((img) => ({
              src: img.currentSrc || img.src,
              complete: img.complete,
              naturalWidth: img.naturalWidth,
            })));
            expect(imageState.length).toBeGreaterThan(3);
            expect(imageState.filter((image) => image.complete && image.naturalWidth > 0).length).toBeGreaterThan(3);
            await page.screenshot({ path: 'artifacts/ui-browser/public-home-1366-light-en.png', fullPage: true });
            await context.close();
          });
          EOF

          cat > qa-tmp/playwright.config.cjs <<'EOF'
          module.exports = {
            testDir: '.',
            testMatch: /ui-browser\.spec\.cjs/,
            timeout: 120000,
            retries: 0,
            workers: 1,
            use: {
              browserName: 'chromium',
              headless: true,
            },
          };
          EOF
      - name: Run browser QA matrix
        run: npx playwright test --config=qa-tmp/playwright.config.cjs --reporter=line
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-qa-screenshots
          path: artifacts/ui-browser
          if-no-files-found: warn
