name: Temporary Conversation Validation

on:
  push:
    branches:
      - feature/conversation-request-actions

permissions:
  contents: write

jobs:
  prepare-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversation-request-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Synchronize backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile corrections when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already synchronized."
          else
            git commit -m "chore: synchronize npm lockfiles"
            git push origin HEAD:feature/conversation-request-actions
          fi

  frontend:
    needs: prepare-lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversation-request-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    needs: prepare-lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversation-request-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
